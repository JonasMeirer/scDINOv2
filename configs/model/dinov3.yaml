# DINOv3 Model Configuration
# Vanilla DINOv3 backbone (DinoVisionTransformer) with axial 2D RoPE.
_target_: src.scdino.models.lightning.dinov3.DINOv3

name: "dinov3"

# Model architecture parameters
architecture:
  backbone:
    type: dinov3
    dinov3:
      # Input branch
      in_chans: 5
      img_size: 56
      patch_size: 4         # patch grid: 14x14
      # Token / attention sizes
      embed_dim: 128
      depth: 12
      num_heads: 8
      ffn_ratio: 4
      # Storage / register tokens (CLS is always present)
      n_storage_tokens: 4
      # Block / norm / FFN choices
      norm_layer: layernormbf16  # 'layernorm' | 'layernormbf16' | 'rmsnorm'
      ffn_layer: swiglu         # 'mlp' | 'swiglu' | 'swiglu32' | 'swiglu64' | 'swiglu128'
      qkv_bias: false
      proj_bias: true
      ffn_bias: true
      mask_k_bias: false
      # Untie norms (only switch on if you know you want them)
      untie_cls_and_patch_norms: false
      untie_global_and_local_cls_norm: true
      # Regularisation
      drop_path_rate: 0.1
      layerscale_init: 1.0e-5
      # 2D RoPE (DINOv3-style). Use either ``rope_base`` OR
      # ``rope_min_period`` + ``rope_max_period`` (not both).
      rope_base: 100.0
      rope_min_period: null
      rope_max_period: null
      rope_normalize_coords: separate  # 'min' | 'max' | 'separate'
      # Train-time coordinate augmentations (set to null to disable).
      rope_shift_coords: null    # e.g. 0.5  (uniform shift in [-s, +s])
      rope_jitter_coords: null   # e.g. 2.0  (log-uniform per-axis scale)
      rope_rescale_coords: 2  # e.g. 2.0  (log-uniform isotropic scale)
      rope_dtype: fp32           # 'fp32' | 'fp16' | 'bf16'
  # DINO head parameters
  dino_head:
    embed_dim: 128
    hidden_dim: 256
    bottleneck_dim: 32
    output_dim: 2048
    batch_norm: false
  # IBOT head parameters
  ibot_head:
    embed_dim: 64
    hidden_dim: 128
    bottleneck_dim: 32
    output_dim: 2048
    batch_norm: false
  # Model behavior
  ibot_separate_head: false


training:
  # Trainer parameters
  max_epochs: 40
  # Optimizer parameters
  optimizer:
    lr: 8e-04
  # Teacher temperature schedule (linear warmup over training STEPS)
  teacher_temp:
    warmup_steps: 6000
    start_value: 0.04
    end_value: 0.07
  # Weight decay schedule
  weight_decay:
    start_value: 0.001
    end_value: 0.01
  # Momentum schedule
  momentum:
    start_value: 0.992
    end_value: 1.0
  # Loss function parameters
  losses:
    dino:
      output_dim: 2048
      student_temp: 0.1
      center_momentum: 0.9
      center_mode: "mean"
      weight: 1.0
    ibot:
      output_dim: 2048
      student_temp: 0.1
      center_mode: "mean"
      center_momentum: 0.9
      weight: 1.0
    koleo:
      p: 2
      eps: 1e-8
      weight: 0.1
  # kNN evaluation parameters
  knn_eval:
    enable_knn_eval: true
    knn_k: 20
    knn_temperature: 0.07
    knn_max_train_batches: 1000
    knn_val_chunk_size: 1024
    knn_train_chunk_size: 50000
