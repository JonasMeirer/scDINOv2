# DINOv2 StrucPerc Model Configuration
# Perceiver-style backbone with a spatially structured latent grid + 2D RoPE.
_target_: src.scdino.models.lightning.dinov2_StrucPerc.DINOv2StrucPerc

name: "dinov2_StrucPerc"

# Model architecture parameters
architecture:
  backbone:
    type: perceiver
    perceiver:
      # Input branch
      in_chans: 5
      img_size: 50
      patch_size: 1          # input grid: 50x50
      # Token / attention sizes
      embed_dim: 64
      num_heads: 8
      mlp_ratio: 4
      # Latent grid (spatially structured)
      latent_size: [25, 25]  # latent grid: 25x25
      # Block layout
      num_self_blocks: 8
      num_cross_blocks: 1
      depth_outer: 1         # 1 => single cross + N self; >1 => iterated
      # Prefix tokens (CLS is always present)
      reg_tokens: 8
      # Regularisation
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1
      init_values: 1.0e-5
      qkv_bias: true
      qk_norm: false
      # 2D RoPE
      rope_base: 100.0
      rope_scale: latent     # 'latent' | 'input' | 'normalized'
  # DINO head parameters
  dino_head:
    embed_dim: 64
    hidden_dim: 128
    bottleneck_dim: 32
    output_dim: 2048
    batch_norm: false
  # IBOT head parameters
  ibot_head:
    embed_dim: 64
    hidden_dim: 128
    bottleneck_dim: 32
    output_dim: 2048
    batch_norm: false
  # Model behavior
  ibot_separate_head: false


training:
  # Trainer parameters
  max_epochs: 20
  # Optimizer parameters
  optimizer:
    lr: 8e-04
  # Teacher temperature schedule
  teacher_temp:
    warmup_steps: 30
    start_value: 0.04
    end_value: 0.07
  # Weight decay schedule
  weight_decay:
    start_value: 0.001
    end_value: 0.01
  # Momentum schedule
  momentum:
    start_value: 0.992
    end_value: 1.0
  # Loss function parameters
  losses:
    dino:
      output_dim: 2048
      warmup_teacher_temp: 0.04
      teacher_temp: 0.04
      warmup_teacher_temp_epochs: 30
      student_temp: 0.1
      center_momentum: 0.9
      center_mode: "mean"
      weight: 1.0
    ibot:
      output_dim: 2048
      teacher_temp: 0.04
      student_temp: 0.1
      center_mode: "mean"
      center_momentum: 0.9
      weight: 1.0
    koleo:
      p: 2
      eps: 1e-8
      weight: 0.1
  # kNN evaluation parameters
  knn_eval:
    enable_knn_eval: true
    knn_k: 20
    knn_temperature: 0.07
    knn_max_train_batches: 1000
    knn_val_chunk_size: 1024
    knn_train_chunk_size: 50000
