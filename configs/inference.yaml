defaults:
  - datamodule: chronotype
  - model: dinov2 #pretrained/dinov2-large #dinov3-vitb16
  - _self_

mode: "inference" # needed for the transformation
max_batches: 100 # limit processed batches
local_model_path: /home/jonas/Documents/Projects/active/scDINO/outputs/train/dinov2_chronotype/2026-03-31/10-03-01/hf_model # set to local HuggingFace model dir for scdino models, e.g. "outputs/train/.../hf_model", or null

# Hardware configuration
datamodule:
  loader:
    accelerator: "gpu"
    devices: 1
    num_workers: 24
    prefetch_factor: 2
    pin_memory: true
    batch_size: 256
    shuffle: true
    drop_last: true

eval:
  k: 20
  T: 0.07
  query_batch_size: 1024
  train_chunk_size: 50000

# Hydra configuration
hydra:
  run:
    dir: outputs/inference/${model.name}_${datamodule.dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true