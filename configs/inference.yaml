defaults:
  - datamodule: chronotype
  - model: dino # pretrained/dinov3-vitl16 #pretrained/dinov2-large #dinov3-vitb16
  - _self_

mode: "inference" # needed for the transformation
seed: 42
max_batches: 1000 # limit processed batches
local_model_path: /home/jonas/Documents/Projects/active/scDINO/outputs/train/dino_chronotype/2026-04-14/14-20-27/hf_model # set to local HuggingFace model dir for scdino models, e.g. "outputs/train/.../hf_model", or null
conv_mod_flavor: "mean" # "mean", "pick_1", "pick_2", "pick_3", only used for pretrained models to adapt them to non 3 channel images

# Hardware configuration
datamodule:
  loader:
    accelerator: "gpu"
    devices: 1
    num_workers: 24
    prefetch_factor: 2
    pin_memory: true
    batch_size: 256
    shuffle: true
    drop_last: true

eval:
  k: 20
  T: 0.07
  query_batch_size: 1024
  train_chunk_size: 50000

# Hydra configuration
hydra:
  run:
    dir: outputs/inference/${model.name}_${datamodule.dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true