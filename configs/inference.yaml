defaults:
  - datamodule: chronotype
  - model: dinov2-small #dinov3-vitb16
  - _self_

mode: "inference"
max_train_batches: 100

# Hardware configuration
datamodule:
  loader:
    accelerator: "gpu"
    devices: 1
    num_workers: 24
    prefetch_factor: 2
    pin_memory: true
    batch_size: 256
    shuffle: true
    drop_last: true

eval:
  k: 20
  T: 0.07
  query_batch_size: 1024
  train_chunk_size: 50000

# Hydra configuration
hydra:
  run:
    dir: outputs/inference/${model.name}_${datamodule.dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true