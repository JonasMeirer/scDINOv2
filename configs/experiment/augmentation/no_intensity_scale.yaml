# @package _global_
# Ablation: disable per-channel intensity scaling.

defaults:
  - override /model: dinov2
  - override /logging: console

max_batches: null
datamodule:
  transforms:
    intensity_scale_prob: 0.0

hydra:
  sweep:
    dir: outputs/benchmark/augmentation
    subdir: no_intensity_scale_seed${seed}
