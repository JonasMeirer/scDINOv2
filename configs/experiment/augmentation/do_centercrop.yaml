# @package _global_
# Ablation: replace the random resized crop with a deterministic centre crop.
#
# Applies to global and local views alike, so every local view is taken from the
# same centre region and multi-crop loses its scale/position diversity. The
# photometric and flip/rotation augmentations still differ between views.

defaults:
  - override /model: dinov2
  - override /logging: console

max_batches: null
datamodule:
  transforms:
    do_center_crop: true

hydra:
  sweep:
    dir: outputs/benchmark/augmentation
    subdir: do_centercrop_seed${seed}
