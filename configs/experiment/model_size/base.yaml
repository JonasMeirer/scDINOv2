# @package _global_
# Model size benchmark: base ViT (embed_dim=384, depth=12, num_heads=12).

defaults:
  - override /model: dinov2
  - override /logging: console

max_batches: null
model:
  architecture:
    backbone:
      vit:
        embed_dim: 384
        depth: 12
        num_heads: 12
    dino_head:
      embed_dim: 384
      hidden_dim: 768
    ibot_head:
      embed_dim: 384
      hidden_dim: 768

hydra:
  sweep:
    dir: outputs/benchmark/model_size
    subdir: base_seed${seed}
