defaults:
  - datamodule: chronotype
  - model: dinov2
  - trainer: default
  - logging: console
  - _self_

mode: "train"
max_batches: 1000 # for debugging, leave blank for full training

hardware:
  accelerator: "gpu"
  devices: 1

# Hydra configuration
hydra:
  run:
    dir: outputs/train/${model.name}_${datamodule.dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true