[project]
name = "scdino"
version = "0.1.0"
description = "Self-supervised representation learning for multi-channel microscopy images with DINO, DINOv2 and DINOv3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
keywords = [
  "self-supervised-learning",
  "representation-learning",
  "microscopy",
  "single-cell",
  "vision-transformer",
  "dino",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchaudio==2.5.1",
  "tifffile>=2026.3.3",
  "transformers>=5.3.0",
  "hydra-core>=1.3.2",
  "lightning>=2.6.1",
  "pandas>=3.0.1",
  "tqdm>=4.67.3",
  "ruff>=0.15.7",
  "cellpose>=4.0.9",
  "scikit-image>=0.26.0",
  "ipynb>=0.5.1",
  "seaborn>=0.13.2",
  "mlflow>=1.27.0",
  "timm>=1.0.26",
  "hydra-submitit-launcher>=1.2.0",
  "hydra-joblib-launcher>=1.2.0",
  "scikit-learn>=1.8.0",
  "zarr>=3.1.6",
  "pyarrow>=24.0.0",
  "umap-learn>=0.5.12",
  "hdbscan>=0.8.42",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

# The source tree is imported as `src.scdino.*` and only works with the repository
# root as the working directory, so there is nothing to build or install.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
