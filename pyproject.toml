[project]
name = "scdino"
version = "0.1.0"
description = "Self-supervised representation learning for multi-channel microscopy images with DINO, DINOv2 and DINOv3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
keywords = [
  "self-supervised-learning",
  "representation-learning",
  "microscopy",
  "single-cell",
  "vision-transformer",
  "dino",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchaudio==2.5.1",
  "tifffile>=2026.3.3",
  "transformers>=5.3.0",
  "hydra-core>=1.3.2",
  "lightning>=2.6.1",
  "pandas>=3.0.1",
  "tqdm>=4.67.3",
  "cellpose>=4.0.9",
  "scikit-image>=0.26.0",
  "ipynb>=0.5.1",
  "seaborn>=0.13.2",
  "mlflow>=1.27.0",
  "timm>=1.0.26",
  "hydra-submitit-launcher>=1.2.0",
  "hydra-joblib-launcher>=1.2.0",
  "scikit-learn>=1.8.0",
  "zarr>=3.1.6",
  "pyarrow>=24.0.0",
  "umap-learn>=0.5.12",
  "hdbscan>=0.8.42",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scdino"]

[tool.ruff]
target-version = "py311"
# Ruff's default. Stated explicitly because `ruff format` targets it, and the
# tree is already formatted to it — changing this value reformats the repo.
line-length = 88

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) plus the pycodestyle errors that catch
# real defects (E4 imports, E7 statements, E9 syntax/IO). The codebase passes
# this cleanly and CI enforces it.
#
# Deliberately not enabled yet: "I" (import sorting, 20 findings), "B" (35),
# "SIM" (12), "UP" (207). They are worth adopting, but every one of them
# rewrites code inside the vendored Lightly and DINOv3 regions, which would
# undo the byte-for-byte comparability with upstream that THIRD_PARTY_NOTICES.md
# depends on. Adopt them per-directory, excluding the vendored files, rather
# than repo-wide.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
